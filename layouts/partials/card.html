<article class="card"><a href="{{ .RelPermalink }}"><div class="thumb"{{ with .Params.image }} style="background-image:linear-gradient(180deg,rgba(5,9,4,.03),rgba(5,9,4,.28)),url('{{ . }}');background-size:cover;background-position:center;background-repeat:no-repeat"{{ end }}><span>{{ .Params.label }}</span></div><div class="card-body"><div class="meta">{{ .Date.Format "2006.01.02" }}</div><h3>{{ .Title }}</h3><p>{{ .Description }}</p></div></a></article>
